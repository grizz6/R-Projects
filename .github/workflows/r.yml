name: R

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  parse:
    # These are analysis scripts, not an R package, and the field data they read is not in
    # the repo, so the check is that every script is valid R.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Check every R script parses
        shell: Rscript {0}
        run: |
          files <- list.files(".", pattern = "\\.[Rr]$", recursive = TRUE)
          bad <- character()
          for (f in files) {
            msg <- tryCatch({ parse(f); NULL }, error = function(e) conditionMessage(e))
            if (!is.null(msg)) bad <- c(bad, paste0(f, ": ", msg))
          }
          cat(length(files), "R scripts checked\n")
          if (length(bad)) {
            cat(bad, sep = "\n")
            quit(status = 1)
          }
